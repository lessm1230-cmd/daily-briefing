name: Daily Briefing Update & Deploy

on:
  schedule:
    # KST. GitHub scheduled jobs have recently started roughly 2-3 hours late.
    # Early backup attempts improve the chance of a first publication before 07:00.
    - cron: "37 2 * * *"
      timezone: "Asia/Seoul"
    - cron: "7 3 * * *"
      timezone: "Asia/Seoul"
    - cron: "37 3 * * *"
      timezone: "Asia/Seoul"
    - cron: "7 4 * * *"
      timezone: "Asia/Seoul"
    - cron: "17 4 * * *"
      timezone: "Asia/Seoul"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Skip redundant scheduled updates after today's first successful publication
        id: already_published
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime
          from zoneinfo import ZoneInfo

          today = datetime.now(ZoneInfo("Asia/Seoul")).date()
          repo = os.environ["GITHUB_REPOSITORY"]
          run_id = int(os.environ["GITHUB_RUN_ID"])
          url = f"https://api.github.com/repos/{repo}/actions/workflows/daily.yml/runs?status=success&per_page=50"
          req = urllib.request.Request(url, headers={
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          })
          published = False
          try:
              with urllib.request.urlopen(req, timeout=15) as response:
                  runs = json.load(response).get("workflow_runs", [])
              for run in runs:
                  if run["id"] == run_id or run.get("conclusion") != "success":
                      continue
                  finished_at = datetime.fromisoformat(run["updated_at"].replace("Z", "+00:00"))
                  if finished_at.astimezone(ZoneInfo("Asia/Seoul")).date() == today:
                      published = True
                      break
          except Exception as exc:
              # A temporary GitHub API failure should never block publication.
              print(f"Publication-check warning: {exc}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as result:
              result.write(f"skip={'true' if published else 'false'}\n")
          print("Already published today; skip repeated deployment." if published
                else "No previous successful publication today; update now.")
          PY

      - name: Checkout
        if: steps.already_published.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Setup Python
        if: steps.already_published.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.already_published.outputs.skip != 'true'
        run: pip install korean-lunar-calendar

      - name: Update today's briefing
        if: steps.already_published.outputs.skip != 'true'
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python scripts/update.py

      - name: Update today's subscription news
        if: steps.already_published.outputs.skip != 'true'
        env:
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
        run: python scripts/update_subscription.py

      - name: Setup Pages
        if: steps.already_published.outputs.skip != 'true'
        uses: actions/configure-pages@v5

      - name: Upload site
        if: steps.already_published.outputs.skip != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        if: steps.already_published.outputs.skip != 'true'
        id: deployment
        uses: actions/deploy-pages@v4
