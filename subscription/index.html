<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>오늘의 청약소식</title>
<style>
:root{--bg:#f5f6fa;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--red:#dc2626;--redbg:#fef2f2;--blue:#2563eb;--bluebg:#eff6ff;--green:#047857;--greenbg:#ecfdf5;--amber:#b45309;--amberbg:#fffbeb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif}.wrap{max-width:980px;margin:0 auto;padding:20px 14px 50px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}h1{margin:0 0 5px;font-size:27px}.meta{font-size:13px;color:var(--muted)}.copyall{border:0;background:#111827;color:#fff;border-radius:10px;padding:10px 13px;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:12px 0 16px}.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px}.stat .n{font-size:24px;font-weight:900}.stat .label{font-size:12px;color:var(--muted);margin-top:2px}
.section-title{font-weight:900;font-size:18px;margin:18px 0 9px}.card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:14px;margin:8px 0}.card-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.name{font-size:16px;font-weight:850;line-height:1.45}
.badges{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}.badge{display:inline-flex;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:800;white-space:nowrap}.badge.type{background:var(--bluebg);color:var(--blue)}.badge.red{background:var(--redbg);color:var(--red)}.badge.green{background:var(--greenbg);color:var(--green)}.badge.amber{background:var(--amberbg);color:var(--amber)}
.info{display:grid;grid-template-columns:88px 1fr;gap:5px 8px;margin-top:10px;font-size:13px;line-height:1.5}.k{color:var(--muted)}.v{font-weight:600}.links{display:flex;gap:7px;margin-top:11px;flex-wrap:wrap}.links a,.copy{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 9px;font-size:12px;text-decoration:none;color:var(--text);cursor:pointer}
.empty{background:#fff;border:1px solid var(--line);border-radius:12px;padding:30px;text-align:center;color:var(--muted)}.note{font-size:11px;color:var(--muted);line-height:1.5;margin-top:16px}
#toast{position:fixed;right:18px;bottom:18px;background:#111827;color:#fff;padding:10px 13px;border-radius:9px;opacity:0;transition:.2s;pointer-events:none}#toast.show{opacity:1}
@media(max-width:640px){.wrap{padding:14px 9px 35px}h1{font-size:23px}.stats{gap:6px}.stat{padding:10px}.stat .n{font-size:20px}.card{padding:12px}.card-head{flex-direction:column}.badges{justify-content:flex-start}}
</style></head>
<body><div class="wrap"><div class="top"><div><h1>🏠 오늘의 청약소식</h1><div class="meta" id="meta">불러오는 중...</div></div><button class="copyall" onclick="copyAll()">📋 전체복사</button></div>
<div class="stats"><div class="stat"><div class="n" id="ongoing">0</div><div class="label">접수중</div></div><div class="stat"><div class="n" id="urgent">0</div><div class="label">마감임박 · D-1 이내</div></div><div class="stat"><div class="n" id="announce">0</div><div class="label">오늘발표</div></div></div>
<div id="content"></div><div class="note">※ 청약 자격·접수시간·일정 변경 여부는 반드시 청약홈 모집공고에서 최종 확인하세요. 데이터 출처: 한국부동산원 청약홈 분양정보 OpenAPI.</div></div><div id="toast">복사했습니다</div>
<script>
let DATA=null;function toast(){const t=document.getElementById('toast');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1000)}function copyText(t){navigator.clipboard.writeText(t).then(toast)}
function itemText(x){return `${x.name}\n[${x.type}] ${x.region||''}\n접수: ${x.start||'-'} ~ ${x.end||'-'}\n당첨자 발표: ${x.announce||'-'}${x.url?`\n${x.url}`:''}`.trim()}
function copyAll(){if(!DATA)return;copyText(`${DATA.date_label} 오늘의 청약소식\n\n`+DATA.items.map(itemText).join('\n\n'))}
function badges(x){const out=[`<span class="badge type">${x.type}</span>`];if(x.status==='접수중')out.push(`<span class="badge green">접수중</span>`);if(x.status==='접수예정')out.push(`<span class="badge amber">접수예정</span>`);if(x.dday_label==='D-DAY'||x.dday===1)out.push(`<span class="badge red">${x.dday_label}</span>`);else if(x.dday_label)out.push(`<span class="badge amber">${x.dday_label}</span>`);if(x.today_announce)out.push(`<span class="badge red">오늘발표</span>`);return out.join('')}
function card(x){const el=document.createElement('div');el.className='card';el.innerHTML=`<div class="card-head"><div class="name">${x.name}</div><div class="badges">${badges(x)}</div></div><div class="info"><div class="k">지역</div><div class="v">${x.region||'-'}</div><div class="k">접수기간</div><div class="v">${x.start||'-'} ~ ${x.end||'-'}</div><div class="k">당첨발표</div><div class="v">${x.announce||'-'}</div><div class="k">공급위치</div><div class="v">${x.address||'-'}</div></div><div class="links">${x.url?`<a href="${x.url}" target="_blank" rel="noopener">공고 보기 ↗</a>`:''}<button class="copy">📋 복사</button></div>`;el.querySelector('.copy').onclick=()=>copyText(itemText(x));return el}
function render(){document.getElementById('meta').textContent=`${DATA.date_label} · 마지막 업데이트 ${DATA.updated_at}`;document.getElementById('ongoing').textContent=DATA.counts.ongoing;document.getElementById('urgent').textContent=DATA.counts.urgent;document.getElementById('announce').textContent=DATA.counts.announce_today;const c=document.getElementById('content');c.innerHTML='';if(!DATA.items.length){c.innerHTML='<div class="empty">오늘 표시할 청약·무순위 일정이 없습니다.</div>';return}const general=DATA.items.filter(x=>x.type==='청약');const random=DATA.items.filter(x=>x.type==='무순위');if(general.length){const h=document.createElement('div');h.className='section-title';h.textContent='📌 청약';c.appendChild(h);general.forEach(x=>c.appendChild(card(x)))}if(random.length){const h=document.createElement('div');h.className='section-title';h.textContent='🔥 무순위';c.appendChild(h);random.forEach(x=>c.appendChild(card(x)))}}
fetch('data.json?ts='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(d=>{DATA=d;render()}).catch(()=>{document.getElementById('meta').textContent='데이터를 불러오지 못했습니다.'})
</script></body></html>
